<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS AI Assistant - Rekognition & Polly</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .chat-container { 
            width: 480px; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .chat-box { 
            height: 400px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            overflow-y: scroll; 
            padding: 10px; 
            margin-bottom: 10px; 
            background: #fafafa; 
        }
        .message { 
            margin-bottom: 12px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            line-height: 1.5; 
        }
        .user-msg { 
            background: #dcf8c6; 
            text-align: right; 
        }
        .bot-msg { 
            background: #e2e2e2; 
            text-align: left; 
        }
        input[type="file"] { 
            width: 100%; 
            margin-bottom: 10px; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background: #0056b3; 
        }
        audio { 
            width: 100%; 
            margin-top: 8px; 
        }
        .translation {
            color: #006600;
            font-weight: bold;
            margin-top: 8px;
            border-top: 1px dashed #ccc;
            padding-top: 6px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🤖 AWS AI Assistant</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Xin chào! Hãy tải lên một bức ảnh để AI phân tích đối tượng nhé.</div>
    </div>
    
    <input type="file" id="imageInput" accept="image/jpeg, image/png">
    <button onclick="uploadImage()">Gửi ảnh phân tích</button>
</div>

<script>
    const API_URL = "https://vfjytluh9l.execute-api.ap-southeast-2.amazonaws.com/analyze";

    // Hàm chuyển đổi các từ khóa tiếng Anh sang tiếng Việt
    function translateToVietnamese(englishText) {
        let translated = englishText
            .replace("I have detected the following objects in the image:", "Tôi đã phát hiện các đối tượng sau trong ảnh:")
            .replace("I could not detect any clear objects in this image.", "Tôi không thể phát hiện bất kỳ đối tượng rõ ràng nào trong ảnh này.")
            // Dịch thêm một số từ khóa nhãn phổ biến nếu có
            .replace(/Grassland/g, "Thảm cỏ")
            .replace(/Outdoors/g, "Ngoài trời")
            .replace(/Ranch/g, "Trang trại")
            .replace(/Grazing/g, "Đang chăn thả")
            .replace(/Cow/g, "Con bò")
            .replace(/Road/g, "Đường đi")
            .replace(/License Plate/g, "Biển số xe")
            .replace(/Car/g, "Xe hơi")
            .replace(/Helmet/g, "Mũ bảo hiểm")
            .replace(/Person/g, "Người");
        return translated;
    }

    function uploadImage() {
        const fileInput = document.getElementById('imageInput');
        const chatBox = document.getElementById('chatBox');
        
        if (fileInput.files.length === 0) {
            alert("Vui lòng chọn một bức ảnh trước!");
            return;
        }
        
        const file = fileInput.files[0];
        
        chatBox.innerHTML += `<div class="message user-msg">Đã gửi ảnh: <b>${file.name}</b></div>`;
        chatBox.innerHTML += `<div class="message bot-msg" id="loading">⏳ Đang phân tích hình ảnh và tạo giọng đọc...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
            const base64Image = reader.result.split(',')[1];
            
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: base64Image,
                    filename: file.name
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').remove();
                if (data.audioUrl) {
                    const vietnameseText = translateToVietnamese(data.text);
                    chatBox.innerHTML += `
                        <div class="message bot-msg">
                            ✅ <b>Kết quả gốc (English):</b><br>${data.text}<br>
                            <div class="translation">🇻🇳 <b>Bản dịch tiếng Việt:</b><br>${vietnameseText}</div>
                            <br>🔊 <b>Nghe giọng đọc AI (English Polly):</b><br>
                            <audio controls src="${data.audioUrl}"></audio>
                        </div>`;
                } else {
                    chatBox.innerHTML += `<div class="message bot-msg" style="color: red;">❌ Lỗi: ${data.error || 'Không thể xử lý yêu cầu.'}</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message bot-msg" style="color: red;">❌ Lỗi kết nối: ${error.message}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        };
    }
</script>

</body>
</html>
